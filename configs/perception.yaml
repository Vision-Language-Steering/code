# @package perception
# Perception Modules Configuration

# ============================================================
# Keypoint Detector
# ============================================================
keypoint_detector:
  num_candidates_per_mask: 5
  min_dist_bt_keypoints: 0.05
  max_mask_ratio: 0.5
  device: ${device}
  seed: ${seed}
  
  # Workspace bounds for filtering
  bounds_min: [-1.0, -0.75, -0.1]
  bounds_max: [1.00, 0.75, 1.2]
  
  # Feature extractor: dinov3_vitb16, dinov3_vitl16, dinov2_vits14, etc.
  feature_extractor: dinov3_vitb16

# ============================================================
# VLM Agent (for guidance generation)
# ============================================================
vlm_agent:
  base_url: null            # Set AZURE_OPENAI_BASE_URL env var (for Azure) or leave null for OpenAI
  model: gpt-5.6-terra      # Azure deployment name (rebuttal runs; was gpt-5.1 for paper runs)
  api_key: null             # Set OPENAI_API_KEY env var (or AZURE_OPENAI_API_KEY for Azure)
  temperature: 1.0
  max_completion_tokens: 6000  # headroom for reasoning tokens on gpt-5.x (was 2000)
  query_template_dir: vlm_query/
  patterns_file: null       # Override task_specific_patterns source: null = env default template,
                            # "none" = no task-specific patterns (generic-prompt ablation),
                            # or a filename inside query_template_dir

# ============================================================
# SAM3 Segmentation (optional, disabled by default)
# ============================================================
sam3:
  enabled: false            # SAM3 can't detect small objects well

# ============================================================
# Gemini Grounding (preferred for visual grounding)
# ============================================================
gemini_grounding:
  enabled: true
  api_key: null             # Set GOOGLE_API_KEY env var
  model: gemini-robotics-er-2-preview  # rebuttal runs (was gemini-3-flash-preview for paper runs)
  
  # Default objects to detect (overridden per task)
  default_objects:
    - drawer handle
    - sliding handle
    - slider handle
    - black switch
    - red cube
    - blue cube
    - pink cube

# ============================================================
# Gemini Stage Recognition (for real-time stage + guidance decisions)
# ============================================================
gemini:
  api_key: null             # Set GOOGLE_API_KEY env var
  model: gemini-robotics-er-2-preview  # rebuttal runs; fastest tested (1.7s) + embodied-reasoning tier

